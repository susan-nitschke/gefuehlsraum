<style>
/* Aubergine-Palette: dunkler Grund wie der Anzug, Flieder als Leuchtfarbe, Knospen-Gelbgrün für Achtsamkeit */
:root{
  --bg:#2A1A23; --surface:#36232E; --surface-2:#452D3B; --ink:#F1E9EC; --muted:#BCA9B4; --line:#4F3745;
  --accent:#D4B3D6; --accent-soft:#4B3048; --accent-ink:#2A1A23;
  --warm:#E2BBDA; --warm-soft:#4D2F44; --calm:#CDCD7C; --calm-soft:#3C3A27; --danger:#F0A495;
  --display:"Newsreader", Georgia, "Times New Roman", serif;
  --body:"Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 120px}
h1,h2,h3{font-family:var(--display);font-weight:500;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:2rem;line-height:1.1} h2{font-size:1.4rem;line-height:1.2} h3{font-size:1.1rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.85rem}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.sans{font-family:var(--body);font-weight:600;font-size:1rem}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;border-bottom:1px solid var(--line);margin-bottom:18px}
.brand{font-family:var(--display);font-style:italic;font-size:1.25rem}
.who{border:0;background:var(--surface-2);color:var(--ink);font:600 .8rem var(--body);padding:7px 12px;border-radius:999px;cursor:pointer;max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stack{display:flex;flex-direction:column;gap:14px}
.section{display:flex;flex-direction:column;gap:12px;margin-top:22px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.banner{background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;font-size:.88rem}
.banner.err{background:var(--warm-soft);color:var(--ink)}
.empty{color:var(--muted);text-align:center;padding:18px 8px}
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 .9rem var(--body);padding:10px 16px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn.small{padding:6px 12px;font-size:.8rem}
.btn.danger{color:var(--danger);border-color:var(--danger);background:none}
.btn:disabled{opacity:.6;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;text-align:left;border:0;border-radius:var(--r);padding:16px;cursor:pointer;font:inherit;color:inherit}
.tile .big{font-family:var(--display);font-size:2rem;line-height:1}
.tile.feel{background:var(--warm-soft)} .tile.mind{background:var(--calm-soft)}
.listbtn{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 0;font:inherit;color:inherit;cursor:pointer}
.listbtn:first-child{border-top:0}
.chev{color:var(--muted)}
.mic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.mic svg{width:20px;height:20px}
.mic.warm{background:var(--warm-soft);color:var(--warm)} .mic.calm{background:var(--calm-soft);color:var(--calm)}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-weight:700;color:var(--muted)}
.dot{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--warm);color:var(--surface);font-size:.72rem;font-weight:700}
.entry{display:grid;grid-template-columns:64px 1fr;gap:12px;padding:14px 0;border-top:1px solid var(--line)}
.entry:first-child{border-top:0}
.when{font-size:.8rem;color:var(--muted)} .when b{display:block;font-size:1rem;color:var(--ink);font-weight:600}
.entry h3{font-family:var(--body);font-weight:600;font-size:1rem}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.88rem;margin:6px 0 0}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:.72rem;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.pill.yes{background:var(--calm-soft);color:var(--calm)} .pill.no{background:var(--warm-soft);color:var(--warm)} .pill.ac{background:var(--accent-soft);color:var(--accent)}
.scale{display:flex;gap:3px;align-items:center}
.scale i{width:9px;height:9px;border-radius:2px;background:var(--surface-2)} .scale i.on{background:var(--calm)}
form{display:flex;flex-direction:column;gap:14px}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.86rem}
label .hint{font-weight:400;color:var(--muted);font-size:.8rem}
input,textarea,select{font:400 1rem var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:76px;resize:vertical} textarea.long{min-height:220px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 .85rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--warm);border-color:var(--warm);color:var(--surface)}
fieldset{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
legend{font-weight:600;font-size:.86rem;margin-bottom:6px;padding:0}
.seg-tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px}
.seg-tabs button{border:0;background:none;color:var(--muted);font:600 .86rem var(--body);padding:8px 6px;border-radius:9px;cursor:pointer}
.seg-tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
.weeknav button{border:0;background:none;color:var(--ink);font:600 1.1rem var(--body);width:40px;height:36px;border-radius:999px;cursor:pointer}
.weeknav button:disabled{opacity:.3}
.weeknav span{font-weight:600;font-size:.9rem}
.watch{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--warm-soft);border-radius:var(--r);padding:14px 16px}
.watch .t{font-family:var(--display);font-size:2.2rem;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:500;line-height:1.1}
.stat span{font-size:.78rem;color:var(--muted)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;font-size:.8rem;min-width:860px}
th,td{text-align:left;vertical-align:top;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--surface-2);font-weight:600}
tr:last-child td{border-bottom:0}
.media{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.media:first-child{border-top:0}
.hw{display:flex;flex-direction:row;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line);font-weight:400}
.hw:first-child{border-top:0}
.hw input{width:22px;height:22px;flex:none;margin-top:2px;accent-color:var(--accent)}
.hw.done .t{text-decoration:line-through;color:var(--muted)}
audio{width:100%;margin-top:8px}
.lesson{display:flex;flex-direction:column;gap:16px;max-width:65ch}
.lesson .lead{font-family:var(--display);font-size:1.2rem;line-height:1.45}
.lesson h2{font-size:1.25rem;margin-top:6px}
.lesson p{line-height:1.65;white-space:pre-line}
.keynote{background:var(--warm-soft);border-radius:var(--r);padding:16px 18px;font-family:var(--display);font-style:italic;font-size:1.2rem;line-height:1.4}
.keynote .eyebrow{font-style:normal;font-family:var(--body);display:block;margin-bottom:6px}
.chat{display:flex;flex-direction:column;gap:8px}
.day{align-self:center;font-size:.72rem;color:var(--muted);font-weight:600;margin:8px 0 2px}
.bubble{max-width:82%;padding:10px 14px;border-radius:18px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble .meta{display:block;font-size:.7rem;opacity:.75;margin-top:4px}
.bubble.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:6px}
.bubble.them{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px}
.composer{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:row;gap:8px;align-items:flex-end;background:var(--bg);padding-block:10px 4px}
.composer textarea{min-height:46px;max-height:160px;border-radius:22px;padding:11px 16px}
.composer .btn{flex:none;height:46px}
.chat-note{font-size:.78rem;color:var(--muted);text-align:center}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{position:relative;border:0;background:none;color:var(--muted);font:600 .68rem var(--body);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 10px;cursor:pointer}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
.tab .dot{position:absolute;top:4px;left:calc(50% + 6px);min-width:17px;height:17px;font-size:.65rem;padding:0 4px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.88rem;z-index:20;max-width:90vw;text-align:center}
.login{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:22px;max-width:420px;margin:0 auto}
.login .brand{font-size:2.6rem}
.spinner{color:var(--muted);padding:40px 0;text-align:center}
@media (max-width:420px){.two{grid-template-columns:1fr}h1{font-size:1.7rem}}
@media (prefers-reduced-motion:no-preference){.view{animation:in .25s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="topbar" hidden>
    <span class="brand">Gefühlsraum</span>
    <button class="who" id="who" type="button">Profil</button>
  </header>
  <main id="app"><p class="spinner">Gefühlsraum wird geladen …</p></main>
</div>
<nav class="tabbar" aria-label="Bereiche" id="tabbar" hidden><div class="in" id="tabs"></div></nav>
<div class="toast" id="toast" role="status" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
/* ===================== Verbindung ===================== */
const SUPABASE_URL = "https://uuhzchqjcowjokmbspvj.supabase.co";
const SUPABASE_KEY = "sb_publishable_2Fz2XLOehKwqyVzKT7aymA_lIlitkvA";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ===================== Symbole ===================== */
const IC={
 home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg>',
 heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',

 play:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
 wave:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 12h2M8 8v8M12 5v14M16 9v6M20 11v2"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>',

};
const FEELINGS=["Freude","Dankbarkeit","Liebe","Ruhe","Traurigkeit","Schmerz","Wut","Ärger","Angst","Scham","Unruhe","Leere","Taubheit","Überforderung","Hilflosigkeit","Einsamkeit"];

/* ===================== Hilfsfunktionen ===================== */
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dash=s=>s!==null&&s!==undefined&&String(s).trim()?esc(s):"–";
const p2=n=>String(n).padStart(2,"0");
const WD=["So","Mo","Di","Mi","Do","Fr","Sa"];
const MONTHS=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const DAYS=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
function iso(d){return `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`}
function parseD(s){return new Date(String(s).slice(0,10)+"T12:00:00")}
function dShort(s){const d=parseD(s);return `${p2(d.getDate())}.${p2(d.getMonth()+1)}.`}
function dDay(s){return WD[parseD(s).getDay()]}
function today(){return iso(new Date())}
function nowT(){const d=new Date();return `${p2(d.getHours())}:${p2(d.getMinutes())}`}
function hm(t){return t?String(t).slice(0,5):""}
function weekStart(offset=0){const d=new Date();d.setHours(12,0,0,0);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd+offset*7);return d}
function weekRange(offset=0){const s=weekStart(offset);const e=new Date(s);e.setDate(e.getDate()+6);return {start:iso(s),end:iso(e),label:`${dShort(iso(s))} bis ${dShort(iso(e))}${e.getFullYear()}`}}
function toast(t){const el=document.getElementById("toast");el.textContent=t;el.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>el.hidden=true,2600)}
function safeUrl(u){return /^https:\/\//i.test(String(u||"").trim())?String(u).trim():""}
function initials(n){return esc(String(n||"?").trim().split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase())}
function friendlyError(e){
 const m=String(e&&e.message||e||"");
 if(/Invalid login credentials/i.test(m))return "E-Mail oder Passwort stimmt nicht.";
 if(/network|fetch/i.test(m))return "Keine Verbindung. Prüfe dein Internet und versuch es noch einmal.";
 if(/JWT|session/i.test(m))return "Du wurdest abgemeldet. Bitte melde dich neu an.";
 return "Das hat nicht geklappt: "+m;
}
async function q(promise){const {data,error,count}=await promise;if(error)throw error;return count!==undefined&&count!==null&&data===null?count:data}

/* ===================== Zustand ===================== */
let me=null;                 // eigenes Profil
let view="", sub=null, learnTab="theory", weekOff=0, thread=null, coachClient=null, draft="", pollTimer=null;
let names={};                // id -> Name (für Trainerin)
let renderToken=0;

/* ===================== Start & Anmeldung ===================== */
async function boot(){
 const {data:{session}}=await sb.auth.getSession();
 if(!session){showLogin();return}
 await loadMe(session.user);
}
async function loadMe(user){
 try{
  const {data,error}=await sb.from("profiles").select("*").eq("id",user.id).single();
  if(error)throw error;
  me=data;
  document.getElementById("topbar").hidden=false;
  document.getElementById("tabbar").hidden=false;
  document.getElementById("who").textContent=me.display_name||"Profil";
  if(me.role==="coach"){const {data:ps}=await sb.from("profiles").select("id,display_name,role");(ps||[]).forEach(p=>names[p.id]=p.display_name||"Ohne Namen")}
  go(me.role==="coach"?"clients":"home");
 }catch(e){showLogin(friendlyError(e))}
}
function showLogin(msg){
 me=null;clearInterval(pollTimer);
 document.getElementById("topbar").hidden=true;
 document.getElementById("tabbar").hidden=true;
 app.innerHTML=`<div class="login view">
  <div class="stack" style="gap:8px"><span class="brand">Gefühlsraum</span><p class="muted">Dein Klientenbereich im Gefühlstraining bei Susan Nitschke.</p></div>
  ${msg?`<div class="banner err">${esc(msg)}</div>`:""}
  <form id="login-form" class="card">
   <label>E-Mail<input type="email" id="l-email" autocomplete="username" required></label>
   <label>Passwort<input type="password" id="l-pass" autocomplete="current-password" required></label>
   <button class="btn primary" type="submit" style="align-self:flex-start">Anmelden</button>
  </form>
  <p class="small muted">Deinen Zugang bekommst du von Susan. Passwort vergessen? Schreib Susan kurz, sie setzt es für dich zurück.</p>
 </div>`;
 document.getElementById("login-form").onsubmit=async e=>{

/* ===================== Navigation ===================== */
const TABS={
 client:[["home","Heute",IC.home],["feel","Gefühle",IC.heart],["mind","Achtsamkeit",IC.leaf],["learn","Lernen",IC.book],["chat","Nachrichten",IC.chat]],
 coach:[["clients","Klienten",IC.users],["inbox","Nachrichten",IC.chat],["ctheory","Theorie",IC.book],["cmedia","Medien",IC.music],["chw","Aufgaben",IC.task]]
};
let badges={};
function renderTabs(){
 const tabs=TABS[me.role==="coach"?"coach":"client"];
 const active=view==="client"?"clients":view==="profile"?"":view;
 document.getElementById("tabs").innerHTML=tabs.map(([id,l,i])=>`<button class="tab" data-tab="${id}" ${active===id?'aria-current="page"':''}>${i}<span>${l}</span>${badges[id]?`<span class="dot num">${badges[id]}</span>`:""}</button>`).join("");
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest(".tab");if(b)go(b.dataset.tab)});
document.getElementById("who").onclick=()=>go("profile");
async function refreshBadges(){
 try{
  if(me.role==="coach"){
   const {count}=await sb.from("messages").select("id",{count:"exact",head:true}).neq("sender_id",me.id).is("read_at",null);
   badges={inbox:count||0};
  }else{
   const {count}=await sb.from("messages").select("id",{count:"exact",head:true}).eq("client_id",me.id).neq("sender_id",me.id).is("read_at",null);
   badges={chat:count||0};
  }
  renderTabs();
 }catch(e){}
}
function go(v,s=null){view=v;sub=s;if(v!=="feel"&&v!=="mind"&&v!=="client")weekOff=0;render();window.scrollTo(0,0)}
async function render(){
 const token=++renderToken;clearInterval(pollTimer);
 renderTabs();
 const V={home:vHome,feel:vFeel,mind:vMind,learn:vLearn,chat:vChat,profile:vProfile,
          clients:vClients,client:vClient,inbox:vInbox,ctheory:vCTheory,cmedia:vCMedia,chw:vCHw};
 if(!app.firstElementChild||!app.firstElementChild.classList.contains("view"))app.innerHTML='<p class="spinner">Lädt …</p>';
 let html;
 try{html=await (V[view]||vHome)()}catch(e){html=`<div class="view stack"><div class="banner err">${esc(friendlyError(e))}</div><button class="btn" data-reload>Noch einmal versuchen</button></div>`}
 if(token!==renderToken)return;
 app.innerHTML=html;
 bind();
 refreshBadges();
}

async function getFeelings(uid,r){return q(sb.from("feelings").select("*").eq("user_id",uid).gte("entry_date",r.start).lte("entry_date",r.end).order("entry_date",{ascending:false}).order("entry_time",{ascending:false,nullsFirst:false}))}
async function getMind(uid,r){return q(sb.from("mindfulness").select("*").eq("user_id",uid).gte("entry_date",r.start).lte("entry_date",r.end).order("entry_date",{ascending:false}).order("entry_time",{ascending:false,nullsFirst:false}))}
async function getReview(uid,r){const {data,error}=await sb.from("week_reviews").select("*").eq("user_id",uid).eq("week_start",r.start).maybeSingle();if(error)throw error;return data}
async function getHomework(uid){return q(sb.from("homework").select("*").eq("user_id",uid).order("done").order("created_at",{ascending:false}))}

/* ===================== Bausteine ===================== */
function weekNav(r){return `<div class="weeknav"><button data-week="-1" aria-label="Vorige Woche">‹</button><span class="num">${weekOff===0?"Diese Woche · ":""}${r.label}</span><button data-week="1" aria-label="Nächste Woche" ${weekOff>=0?"disabled":""}>›</button></div>`}
function scale(n){let h="";for(let i=1;i<=10;i++)h+=`<i class="${i<=n?"on":""}"></i>`;return `<span class="scale" aria-label="${n} von 10">${h}</span>`}
function delBtn(kind,id){return `<button class="btn small ghost" data-del="${kind}:${id}">Löschen</button>`}
function feelEntry(f,own){
 return `<article class="entry"><div class="when"><b class="num">${dShort(f.entry_date)}</b>${dDay(f.entry_date)}${f.entry_time?` · <span class="num">${hm(f.entry_time)}</span>`:""}</div>
 <div style="min-width:0"><div class="row" style="gap:6px"><h3>${esc(f.feeling)}</h3>${f.felt==="Ja"?'<span class="pill yes">gefühlt</span>':f.felt==="Nein"?'<span class="pill no">verdrängt</span>':""}</div>
 <dl class="kv"><dt>Auslöser</dt><dd>${dash(f.trigger)}</dd>${f.felt==="Nein"?`<dt>Verdrängt mit</dt><dd>${dash(f.suppressed)}</dd>`:""}
 <dt>Dauer</dt><dd>${dash(f.duration)}</dd><dt>Unterstützung</dt><dd>${dash(f.support)}</dd><dt>Erkenntnis</dt><dd>${dash(f.insight)}</dd><dt>Resonanz</dt><dd>${dash(f.resonance)}</dd></dl>
 ${own?`<div class="row" style="margin-top:6px">${delBtn("feelings",f.id)}</div>`:""}</div></article>`;
}
function mindEntry(m,own){
 return `<article class="entry"><div class="when"><b class="num">${dShort(m.entry_date)}</b>${dDay(m.entry_date)}${m.entry_time?` · <span class="num">${hm(m.entry_time)}</span>`:""}</div>
 <div style="min-width:0"><div class="row" style="gap:6px"><h3>${esc(m.exercise)}</h3>${m.start_type?`<span class="pill">${esc(m.start_type)}</span>`:""}</div>
 <dl class="kv"><dt>Dauer</dt><dd class="num">${m.duration_min?m.duration_min+" Min.":"–"}</dd><dt>Ort</dt><dd>${dash(m.place)}</dd><dt>Anlass</dt><dd>${dash(m.reason)}</dd>
 <dt>Dabeibleiben</dt><dd class="row" style="gap:8px">${m.stay?scale(m.stay)+`<span class="num small">${m.stay} / 10</span>`:"–"}</dd><dt>Wahrnehmung</dt><dd>${dash(m.insight)}</dd></dl>
 ${own?`<div class="row" style="margin-top:6px">${delBtn("mindfulness",m.id)}</div>`:""}</div></article>`;

function feelTable(list){
 const rows=[...list].reverse();
 if(!rows.length)return `<p class="empty">In dieser Woche gibt es noch keine Einträge.</p>`;
 return `<div class="tablewrap"><table><thead><tr><th>Datum</th><th>Uhrzeit</th><th>Gefühl</th><th>Auslöser</th><th>Gefühlt</th><th>Gefühl verdrängt</th><th>Dauer</th><th>Unterstützung</th><th>Erkenntnis / Ergebnis danach</th><th>Resonanz / Veränderung im Außen</th></tr></thead>
 <tbody>${rows.map(f=>`<tr><td class="num">${dShort(f.entry_date)}</td><td class="num">${dash(hm(f.entry_time))}</td><td>${dash(f.feeling)}</td><td>${dash(f.trigger)}</td><td>${dash(f.felt)}</td><td>${dash(f.suppressed)}</td><td>${dash(f.duration)}</td><td>${dash(f.support)}</td><td>${dash(f.insight)}</td><td>${dash(f.resonance)}</td></tr>`).join("")}</tbody></table></div>`;
}
function mindSummary(list){
 const days=new Set(list.map(m=>m.entry_date)).size, total=list.reduce((a,m)=>a+(m.duration_min||0),0), planned=list.filter(m=>m.start_type==="geplant").length;
 return `${list.length} Übung${list.length===1?"":"en"} an ${days} Tag${days===1?"":"en"} · etwa ${Math.floor(total/60)?Math.floor(total/60)+" Std. ":""}${total%60} Min. bewusst · ${planned} geplant, ${list.length-planned} spontan`;
}
function reviewBlock(rv,editable){
 const r=rv||{};
 if(!editable){
  if(!rv)return `<p class="empty">Für diese Woche gibt es noch keinen Rückblick.</p>`;
  return `<dl class="kv"><dt>Mittelpunkt</dt><dd>${dash(r.focus)}</dd><dt>Unterstützt</dt><dd>${dash(r.support)}</dd><dt>Erkenntnisse</dt><dd>${dash(r.insight)}</dd><dt>Resonanz</dt><dd>${dash(r.resonance)}</dd></dl>`;
 }
 return `<form id="review-form">
  <label>Im Mittelpunkt der Woche<textarea id="r-focus">${esc(r.focus)}</textarea></label>
  <label>Was mich unterstützt hat<textarea id="r-support">${esc(r.support)}</textarea></label>

}

function hwList(items,coach){
 return items.map(h=>coach
  ?`<div class="hw ${h.done?"done":""}"><span class="pill ${h.done?"yes":""}">${h.done?"erledigt":"offen"}</span><span style="min-width:0;flex:1"><span class="t" style="font-weight:600;display:block">${esc(h.title)}</span><span class="small muted">${esc(h.note||"")}${h.due?` · ${esc(h.due)}`:""}</span></span>${delBtn("homework",h.id)}</div>`

function mediaList(items,coach){
 return items.map(m=>{
  const link=safeUrl(m.link_url);
  const action=m.file_path?`<button class="btn small" data-play="${m.id}" data-path="${esc(m.file_path)}">${IC.play} Abspielen</button>`:link?`<a class="btn small" href="${esc(link)}" target="_blank" rel="noopener">${IC.play} Öffnen</a>`:"";
  return `<div class="media"><div class="mic">${m.kind==="Musik"?IC.music:IC.wave}</div><div style="min-width:0"><div class="eyebrow">${esc(m.kind)}${m.minutes?` · <span class="num">${m.minutes} Min.</span>`:""}${coach&&m.for_user?` · für ${esc(names[m.for_user]||"eine Person")}`:""}</div><h3 class="sans">${esc(m.title)}</h3>${m.description?`<p class="small muted">${esc(m.description)}</p>`:""}<div id="player-${m.id}"></div></div><div class="stack" style="gap:6px;align-items:flex-end">${action}${coach?delBtn("media",m.id):""}</div></div>`;
 }).join("");
}
function parseBody(body){
 const parts=[];let cur={h:"",p:[]};
 String(body||"").split("\n").forEach(line=>{
  if(/^\s*##/.test(line)){if(cur.h||cur.p.join("").trim())parts.push(cur);cur={h:line.replace(/^\s*##\s*/,""),p:[]}}
  else cur.p.push(line);
 });
 if(cur.h||cur.p.join("").trim())parts.push(cur);
 return parts.map(x=>`${x.h?`<h2>${esc(x.h)}</h2>`:""}${x.p.join("\n").split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean).map(s=>`<p>${esc(s)}</p>`).join("")}`).join("");
}

async function chatView(clientId,title,eyebrow,back){
 const msgs=await q(sb.from("messages").select("*").eq("client_id",clientId).order("created_at"));
 const unreadIds=msgs.filter(m=>m.sender_id!==me.id&&!m.read_at).map(m=>m.id);
 if(unreadIds.length)sb.from("messages").update({read_at:new Date().toISOString()}).in("id",unreadIds).then(()=>refreshBadges());
 let last="";
 const rows=msgs.map(m=>{const d=new Date(m.created_at);const day=iso(d);let sep="";if(day!==last){last=day;sep=`<div class="day">${WD[d.getDay()]}, ${dShort(day)}</div>`}
  return `${sep}<div class="bubble ${m.sender_id===me.id?"me":"them"}">${esc(m.body)}<span class="meta num">${p2(d.getHours())}:${p2(d.getMinutes())}</span></div>`}).join("");
 return `<div class="view stack">${back?`<button class="btn ghost" data-go="inbox" style="align-self:flex-start">← Alle Nachrichten</button>`:""}

  <div class="chat" id="chat" data-count="${msgs.length}">${rows||'<p class="empty">Noch keine Nachrichten. Schreib die erste.</p>'}</div>

 busy(form,true);
 try{await fn();if(okMsg)toast(okMsg);if(after)after();else render()}
 catch(e){toast(friendlyError(e));busy(form,false)}

 });
 app.querySelectorAll("[data-read]").forEach(b=>b.onclick=async()=>{

  if(!isRead)toast("Als gelesen markiert");render();
 });
 app.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{
  if(b.dataset.confirm!=="1"){b.dataset.confirm="1";b.textContent="Wirklich löschen?";b.classList.add("danger");setTimeout(()=>{if(b.isConnected){b.dataset.confirm="";b.textContent="Löschen";b.classList.remove("danger")}},4000);return}
  const [table,id]=b.dataset.del.split(":");b.disabled=true;
  try{
   if(table==="media"){const {data}=await sb.from("media").select("file_path").eq("id",id).single();if(data&&data.file_path)await sb.storage.from("media").remove([data.file_path])}
   const {error}=await sb.from(table).delete().eq("id",id);if(error)throw error;
   toast("Gelöscht");render();
  }catch(e){toast(friendlyError(e));b.disabled=false}
 });
 app.querySelectorAll("[data-play]").forEach(b=>b.onclick=async()=>{
  b.disabled=true;
  const {data,error}=await sb.storage.from("media").createSignedUrl(b.dataset.path,3600);
  b.disabled=false;
  if(error){toast(friendlyError(error));return}
  const box=document.getElementById("player-"+b.dataset.play);
  if(/\.pdf$/i.test(b.dataset.path)){box.innerHTML=`<a class="btn small" href="${esc(data.signedUrl)}" target="_blank" rel="noopener">PDF öffnen</a>`;return}

 });

 /* Trainerin: Aufgaben */
 const hf=document.getElementById("hw-form");
 if(hf)hf.onsubmit=async e=>{e.preventDefault();
  const target=val("a-client");
  act(hf,async()=>{
   const ids=target?[target]:(await clientList()).map(c=>c.id);
   if(!ids.length)throw new Error("Es gibt noch keine Klienten.");
   const {error}=await sb.from("homework").insert(ids.map(id=>({user_id:id,title:val("a-title"),note:val("a-note")||null,due:val("a-due")||null})));if(error)throw error;
  },"Aufgabe zugewiesen")};
}

boot().catch(e=>showLogin(friendlyError(e)));
</script>
</body>
</html>
